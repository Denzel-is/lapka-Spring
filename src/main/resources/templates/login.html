<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Вход | Maestro Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <style>
    /* Общие стили */
    body {
      background: #ffffff;
      font-family: 'Roboto', sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Карточка */
    .login-card {
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .login-card h2 {
      color: #ff6b00;
      font-weight: 700;
    }

    /* Поля */
    .form-control {
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #ddd;
      padding-left: 50px;
    }

    .position-relative i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #ff6b00;
      font-size: 1.2rem;
    }

    /* Кнопка */
    .btn-login {
      background: #ff6b00;
      color: white;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: #e65a00;
    }

    /* Ссылки */
    .link {
      color: #ff6b00;
      font-weight: 600;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="login-card">
    <h2><i class="bi bi-person-circle"></i> Вход</h2>

    <form th:action="@{/login}" method="post">
      <div class="mb-3 position-relative">
        <i class="bi bi-person-fill"></i>
        <input type="text" class="form-control" name="username" placeholder="Логин" required>
      </div>
      <div class="mb-3 position-relative">
        <i class="bi bi-lock-fill"></i>
        <input type="password" class="form-control" name="password" placeholder="Пароль" required>
      </div>
      <button type="submit" class="btn btn-login w-100">Войти</button>
    </form>

    <div class="mt-3">
      <span>Нет аккаунта?</span>
      <a th:href="@{/register}" class="link">Регистрация</a>
    </div>
  </div>
</div>

</body>
</html>
