<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Каталог | Maestro Pizza</title>

  <th:block th:replace="~{layout :: contentPlaceholder}">
    <th:block th:fragment="contentPlaceholder">

      <!-- Поиск -->
      <div class="row mb-3">
        <div class="col-md-6">
          <form th:action="@{/pizzas}" method="get">
            <div class="input-group">
              <input type="text" name="search" class="form-control"
                     placeholder="Поиск пиццы..." th:value="${search}" />
              <button type="submit" class="btn btn-primary">Искать</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Свайп-меню (просто горизонтальный скролл категорий) -->
      <div class="category-scroll mb-4">
        <a href="#cat-pizza" class="category-link">Пиццы</a>
        <a href="#cat-garnires" class="category-link">Гарниры</a>
        <a href="#cat-drinks" class="category-link">Напитки</a>
        <!-- ... и т.д. -->
      </div>

      <!-- Список карточек пицц -->
      <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="pizza : ${pizzas}">
          <div class="card h-100 pizza-card">
            <img th:src="${pizza.imageUrl}" class="card-img-top" alt="Фото пиццы" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title" th:text="${pizza.name}">Pizza Name</h5>
              <p class="card-text fw-bold mb-2">
                <span th:text="${pizza.price}"></span> ₽
              </p>
              <!-- Кнопка (модальное окно детально) -->
              <button type="button"
                      class="btn btn-outline-info mt-auto open-modal-btn"
                      data-id="${pizza.id}">
                Детальнее
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Кастомное модальное окно -->
      <div id="pizzaModal" class="modal-custom">
        <div class="modal-content-custom">
          <span class="close-modal">&times;</span>
          <div class="modal-body-custom">
            <h3 id="modalPizzaName">Название пиццы</h3>
            <img id="modalPizzaImage" src="#" alt="Пицца" class="img-fluid mb-3" />
            <p id="modalPizzaDescription"></p>
            <p>
              <strong>Цена: </strong>
              <span id="modalPizzaPrice"></span> ₽
            </p>
            <!-- Форма для добавления в корзину -->
            <form th:action="@{/cart/add}" method="post">
              <input type="hidden" name="pizzaId" id="modalPizzaId" value="" />
              <div class="mb-3">
                <label for="quantity" class="form-label">Количество:</label>
                <input type="number" name="quantity" id="quantity"
                       class="form-control" min="1" value="1" required />
              </div>
              <button type="submit" class="btn btn-success">
                Добавить в корзину
              </button>
            </form>
          </div>
        </div>
      </div>

    </th:block>
  </th:block>
</head>
<body></body>
</html>
